# Waterline.xcodeproj is GENERATED (xcodegen generate on the Mac), never committed.
name: Waterline
options:
  bundleIdPrefix: com.craigmerry
  deploymentTarget:
    iOS: "17.0"
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WYGG3JXWMG
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: 1
targets:
  Waterline:
    type: application
    platform: auto
    supportedDestinations: [iOS, visionOS]
    sources: [Waterline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmerry.waterline
        TARGETED_DEVICE_FAMILY: "1,7"
        CODE_SIGN_STYLE: Automatic
        # Answers export compliance at build time (HTTPS to NOAA only), so TestFlight
        # never holds the build on "Missing Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Naming the icon set makes Xcode compile it; CFBundleIconName below must also
        # be set explicitly, or the upload is rejected at validation.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # visionOS icons are layered image stacks, a separate asset.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
    info:
      path: Waterline/Info.plist
      properties:
        CFBundleDisplayName: Waterline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: $(ASSETCATALOG_COMPILER_APPICON_NAME)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Vision Pro opens the room flood as a second scene (an immersive space).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Waterline draws the forecast water line on the camera view and measures steps and curbs with LiDAR.
        NSLocationWhenInUseUsageDescription: Waterline reads the ground height, tides and rain forecast for where you're standing. Your location stays on the phone except for the coordinates sent to public services, including NOAA, NWS, USGS, FEMA, USACE and your city's open data.
        NSMotionUsageDescription: Waterline uses the barometer to measure how far your floor is above the street.
        # Downloaded packs live in Documents/Waterline and show in the Files app (On My iPhone › Waterline)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
