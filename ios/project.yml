name: Waterline
options:
  bundleIdPrefix: com.craigmerry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WYGG3JXWMG
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Waterline:
    type: application
    platform: iOS
    sources: [Waterline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmerry.waterline
    info:
      path: Waterline/Info.plist
      properties:
        CFBundleDisplayName: Waterline
        UILaunchScreen: {}
        NSCameraUsageDescription: Waterline draws the forecast water line on the camera view.
        NSLocationWhenInUseUsageDescription: Waterline uses your location to anchor the water line to real-world height.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
