name: Waterline
options:
  bundleIdPrefix: com.craigm26
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team ID locally in Xcode; CI builds unsigned
targets:
  Waterline:
    type: application
    platform: iOS
    sources: [Waterline]
    info:
      path: Waterline/Info.plist
      properties:
        CFBundleDisplayName: Waterline
        UILaunchScreen: {}
        NSCameraUsageDescription: Waterline draws the forecast water line on the camera view.
        NSLocationWhenInUseUsageDescription: Waterline uses your location to anchor the water line to real-world height.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
