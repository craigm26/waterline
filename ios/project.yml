# Waterline.xcodeproj is GENERATED (xcodegen generate on the Mac), never committed.
name: Waterline
options:
  bundleIdPrefix: com.craigmerry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WYGG3JXWMG
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Waterline:
    type: application
    platform: iOS
    sources: [Waterline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craigmerry.waterline
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Answers export compliance at build time (HTTPS to NOAA only), so TestFlight
        # never holds the build on "Missing Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Naming the icon set makes Xcode compile it; CFBundleIconName below must also
        # be set explicitly, or the upload is rejected at validation.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Waterline/Info.plist
      properties:
        CFBundleDisplayName: Waterline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: Waterline draws the forecast water line on the camera view.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
