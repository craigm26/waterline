name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["demo/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          # city-manager view lands in site/ (see plan/v2-roadmap.md); served at /city/ when present
          if [ -d site ]; then mkdir -p _site/city && cp -r site/. _site/city/; fi
          rm -f _site/lidar/*.b64.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
